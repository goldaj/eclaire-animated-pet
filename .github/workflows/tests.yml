name: Éclaire — tests
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run dependency-free test suite
        run: node --test tests/*.test.cjs
      - name: Check JavaScript syntax
        run: |
          node --check src/eclaire-engine.js
          node --check src/eclaire-widget.js
          node --check src/demo.js
